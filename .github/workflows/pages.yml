name: pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "apps/relay-web/src/**"
      - "apps/relay-web/test/**"
      - "apps/relay-web/package.json"
      - "apps/relay-web/scripts/**"
      - "docs/images/**"
      - "release.json"
      - "packages/movement/browser/**"
      - "packages/movement/schemas/**"
      - "packages/movement/vocabulary/**"
      - "packages/movement/fixtures/corpus/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify static demo assets
        run: node --test apps/relay-web/test/*.verify.mjs
      - name: Stage static workspace and movement modules
        run: node apps/relay-web/scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/relay-web/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
