# Isolated, disposable services. No host data directories or persistent volumes.
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: relay_integration
      POSTGRES_PASSWORD: ${RELAY_TEST_PASSWORD:?test password required}
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d relay_integration"]
      interval: 1s
      timeout: 3s
      retries: 60
  s3:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.integration-s3
    command: ["server", "/data", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER: ${RELAY_TEST_S3_USER:?test access key required}
      MINIO_ROOT_PASSWORD: ${RELAY_TEST_S3_PASSWORD:?test secret key required}
    ports:
      - "127.0.0.1::9000"
    tmpfs:
      - /data:uid=10001,gid=10001,mode=0700
